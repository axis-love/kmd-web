name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: packages/*/dist
          retention-days: 7

  # Publishing remains disabled until KWEB-016.
  # This job is a placeholder that documents the future release pipeline.
  publish:
    name: Publish (disabled)
    runs-on: ubuntu-latest
    needs: verify
    if: false # Disabled until KWEB-016
    steps:
      - name: Placeholder
        run: echo "Publishing is disabled until KWEB-016"