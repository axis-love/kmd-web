name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package contents check
        run: node scripts/check-package-contents.mjs

      - name: API surface check
        run: node scripts/check-api-surface.mjs

      - name: Publish dry-run
        run: node scripts/publish-packages.mjs --dry-run

      - name: Conformance fixture guard
        run: node scripts/check-conformance-fixtures.mjs

      - name: Size report
        run: node scripts/size-report.mjs

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: packages/*/dist
          retention-days: 7

      - name: Upload size report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report
          path: size-report.json
          retention-days: 30

  visual-tests:
    name: Visual Baseline Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build dist artifacts
        run: npm run build

      - name: Pre-render visual fixtures
        run: npm run build:visual

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual tests
        run: npx playwright test --config=playwright.config.ts

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            test-results/visual/
            tests/visual/visual-baselines.test.ts-snapshots/
          retention-days: 14

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14