<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kmd-web — React example</title>
    <!--
      Content Security Policy: compatible with kmd-web defaults.
      - No 'unsafe-inline' anywhere.
      - img-src allows data: and blob: for resolved assets.
      - worker-src 'self' for off-main-thread rendering.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:; worker-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
