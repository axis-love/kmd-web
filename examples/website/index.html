<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>kmd-web Demo</title>
  <link rel="stylesheet" href="/src/styles-import.css" />
  <style>
    /* Page-level horizontal gutter for the centered reader column, mirroring
       the kmd desktop app's .mdr-doc scroll-container padding (16px). The
       library scopes all reader styles to .kmd-reader and intentionally does
       not style the host page, so the demo provides this itself. */
    body { padding: 0 var(--kmd-space-md); }
  </style>
  <script>
    // Match the kmd desktop app's theme boot: set data-theme on <html> so the
    // Shiki dual-theme (github-dark/github-light) CSS in @axis-love/styles
    // resolves to readable colors. Default to the OS preference, persisted
    // under the same "kmd-theme" key the kmd app uses.
    (function () {
      var saved = localStorage.getItem("kmd-theme");
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.backgroundColor =
        theme === "dark" ? "#222428" : "#ffffff";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
