<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>kmd-web Demo</title>
  <link rel="stylesheet" href="/src/styles-import.css" />
  <style>
    /* Page shell only — styles the area OUTSIDE .kmd-reader, which the library
       intentionally does not touch (it scopes all reader styles to .kmd-reader
       and now resets element margins/paddings inside the reader itself).
       The demo provides: font smoothing on the document, a themed page
       background + body font/color, and the 16px horizontal gutter for the
       centered reader column (mirroring the kmd desktop app's .mdr-doc
       scroll-container padding, which lives outside the 800px content cap). */
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      padding: 0 var(--kmd-space-md);
      font-family: var(--kmd-font-body);
      color: var(--kmd-color-on-surface);
      background-color: var(--kmd-color-neutral);
    }
    /* DesignMD theming demo toolbar (KWEB-061). Sits in the page shell,
       outside .kmd-reader — intentionally NOT restyled by the custom theme,
       which stays scoped to the reader subtree. */
    .design-toggle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: var(--kmd-width-content-max);
      margin: 12px auto 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .design-toggle select,
    .design-toggle button,
    .design-file {
      font: inherit;
      padding: 2px 8px;
      border: 1px solid var(--kmd-color-border);
      border-radius: 6px;
      background: var(--kmd-color-surface);
      color: var(--kmd-color-on-surface);
      cursor: pointer;
    }
    .design-status {
      font-size: 12px;
      opacity: 0.75;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60ch;
    }
  </style>
  <script>
    // Match the kmd desktop app's theme boot: set data-theme on <html> so the
    // Shiki dual-theme (github-dark/github-light) CSS in @axis-love/styles
    // resolves to readable colors. Default to the OS preference, persisted
    // under the same "kmd-theme" key the kmd app uses.
    (function () {
      var saved = localStorage.getItem("kmd-theme");
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      // ?theme=light|dark pins the theme for this load without touching the
      // persisted preference — used to review both themes side by side.
      var pinned = new URLSearchParams(location.search).get("theme");
      if (pinned === "light" || pinned === "dark") theme = pinned;
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.backgroundColor =
        theme === "dark" ? "#222428" : "#ffffff";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
