<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>kmd-web Demo</title>
  <link rel="stylesheet" href="/src/styles-import.css" />
  <style>
    /* Page shell — mirrors the kmd desktop app's global.css reset so the
       demo page has the same baseline as the app. The library scopes all
       reader styles to .kmd-reader and intentionally does not reset the
       host page, so without this the browser's default element margins
       (e.g. p { margin: 1em 0 }) stack on top of the library's margins,
       producing larger-than-app vertical gaps around alerts, blockquotes,
       and paragraph text. */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      padding: 0 var(--kmd-space-md);
      font-family: var(--kmd-font-body);
      color: var(--kmd-color-on-surface);
      background-color: var(--kmd-color-neutral);
    }
  </style>
  <script>
    // Match the kmd desktop app's theme boot: set data-theme on <html> so the
    // Shiki dual-theme (github-dark/github-light) CSS in @axis-love/styles
    // resolves to readable colors. Default to the OS preference, persisted
    // under the same "kmd-theme" key the kmd app uses.
    (function () {
      var saved = localStorage.getItem("kmd-theme");
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.backgroundColor =
        theme === "dark" ? "#222428" : "#ffffff";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
